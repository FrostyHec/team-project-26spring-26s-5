# =============================================================================
# CI Workflow
# Runs on PR and push to main
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: |
          cd packages/core && uv sync --all-extras
          cd ../cli && uv sync --all-extras
          cd ../poc_frontend && uv sync --all-extras

      - name: Check formatting
        run: |
          for pkg in packages/core packages/cli packages/poc_frontend; do
            cd $pkg
            uv run ruff format --check src/ tests/
            cd ${{ github.workspace }}
          done

      - name: Check linting
        run: |
          for pkg in packages/core packages/cli packages/poc_frontend; do
            cd $pkg
            uv run ruff check src/ tests/
            cd ${{ github.workspace }}
          done

  language-check:
    name: Language Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run language check
        run: python scripts/check_language.py --root .

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [lint, language-check]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd packages/core && uv sync --all-extras
          cd ../cli && uv sync --all-extras
          cd ../poc_frontend && uv sync --all-extras

      - name: Test core
        run: cd packages/core && uv run pytest tests/ -v --cov=agent_core --cov-report=term-missing

      - name: Test CLI
        run: cd packages/cli && uv run pytest tests/ -v

      - name: Test POC frontend
        run: cd packages/poc_frontend && uv run pytest tests/ -v

  test-vue:
    name: Vue Tests
    runs-on: ubuntu-latest
    needs: [lint, language-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: cd packages/gui && pnpm install

      - name: Run tests
        run: cd packages/gui && pnpm vitest run

      - name: Type check
        run: cd packages/gui && pnpm run type-check

      - name: Build
        run: cd packages/gui && pnpm build
