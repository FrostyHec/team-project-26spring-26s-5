# =============================================================================
# CI Workflow
# Runs on PR and push to main
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Install Python dependencies
        run: |
          cd packages/core && uv sync --all-extras
          cd ../cli && uv sync --all-extras

      - name: Install Vue dependencies
        run: cd packages/gui && pnpm install

      - name: Check Python formatting
        run: |
          for pkg in packages/core packages/cli; do
            cd $pkg
            uv run ruff format --check src/ tests/
            cd ${{ github.workspace }}
          done

      - name: Check Python linting
        run: |
          for pkg in packages/core packages/cli; do
            cd $pkg
            uv run ruff check src/ tests/
            cd ${{ github.workspace }}
          done

      - name: Check Vue formatting
        run: cd packages/gui && pnpm prettier --check --experimental-cli src/

  language-check:
    name: Language Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run language check (Semgrep)
        run: |
          semgrep --config semgrep-rules.yaml \
                  --no-git-ignore \
                  --error \
                  --quiet \
                  packages/ .github/ scripts/

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [lint, language-check]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd packages/core && uv sync --all-extras
          cd ../cli && uv sync --all-extras

      - name: Test core
        run: cd packages/core && uv run pytest tests/ -v --cov=agent_core --cov-report=term-missing --junitxml=pytest-report.xml

      - name: Test CLI
        run: cd packages/cli && uv run pytest tests/ -v --junitxml=pytest-report.xml

      - name: Merge test reports
        if: always()
        run: |
          mkdir -p test-results
          # Combine all JUnit XML reports
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import glob

          merged = ET.Element("testsuites")
          for xml_file in glob.glob("packages/*/pytest-report.xml"):
              tree = ET.parse(xml_file)
              for suite in tree.getroot().iter("testsuite"):
                  merged.append(suite)
          ET.ElementTree(merged).write("test-results/pytest-report.xml", xml_declaration=True, encoding="utf-8")
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-3.12
          path: test-results/pytest-report.xml

  test-vue:
    name: Vue Tests
    runs-on: ubuntu-latest
    needs: [lint, language-check]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Install dependencies
        run: cd packages/gui && pnpm install

      - name: Check formatting
        run: cd packages/gui && pnpm prettier --check --experimental-cli src/

      - name: Run tests
        run: cd packages/gui && pnpm vitest run

      - name: Type check
        run: cd packages/gui && pnpm run type-check

      - name: Build
        run: cd packages/gui && pnpm build
