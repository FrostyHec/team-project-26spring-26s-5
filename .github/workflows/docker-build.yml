name: Docker Build Artifact

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Local Docker image name stored in the artifact"
        required: true
        default: "sustech-campus-assistant"
      image_tag:
        description: "Image tag; use manual to auto-generate manual-<run>-<sha>"
        required: true
        default: "manual"
      platform:
        description: "Single target platform for the portable docker archive"
        required: true
        default: "linux/amd64"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image metadata
        shell: bash
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image_tag="$INPUT_IMAGE_TAG"
          if [ "$image_tag" = "manual" ]; then
            image_tag="manual-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          image_ref="${INPUT_IMAGE_NAME}:${image_tag}"

          {
            echo "IMAGE_REF=$image_ref"
            echo "IMAGE_TAG=$image_tag"
          } >> "$GITHUB_ENV"

          {
            echo "IMAGE_REF=$image_ref"
            echo "IMAGE_NAME=$INPUT_IMAGE_NAME"
            echo "IMAGE_TAG=$image_tag"
            echo "GIT_SHA=$GITHUB_SHA"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          } > /tmp/image-metadata.env

      - name: Build image and load into Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platform }}
          tags: ${{ env.IMAGE_REF }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker archive
        shell: bash
        run: |
          set -euo pipefail
          docker save "$IMAGE_REF" -o /tmp/docker-image.tar
          gzip -f /tmp/docker-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: sustech-campus-assistant-docker-image
          path: |
            /tmp/docker-image.tar.gz
            /tmp/image-metadata.env
          retention-days: 14

      - name: Write summary
        shell: bash
        run: |
          {
            echo "### Docker image artifact"
            echo ""
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Artifact: \`sustech-campus-assistant-docker-image\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
