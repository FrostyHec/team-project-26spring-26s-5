[project]
name = "agent-cli"
version = "0.1.0"
description = "CLI frontend for the ReAct Agent"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-core",
]

[tool.uv.sources]
agent-core = { path = "../core", editable = true }

[project.scripts]
agent-cli = "agent_cli.main:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
